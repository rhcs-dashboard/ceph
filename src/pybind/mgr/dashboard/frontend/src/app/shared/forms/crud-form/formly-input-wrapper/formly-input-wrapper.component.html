<div class="form-item"
     [class.has-error]="showError">
  <label *ngIf="props.label && props.hideLabel !== true"
         [attr.for]="id"
         class="cds--label">
    {{ props.label }}
    <span *ngIf="props.required && props.hideRequiredMarker !== true"
          aria-hidden="true">*</span>
    <cd-helper *ngIf="helper">
      <span [innerHTML]="helper"></span>
    </cd-helper>
  </label>

  <ng-container #fieldComponent></ng-container>

  <div *ngIf="showError"
       class="invalid-feedback">
    <formly-validation-message [field]="field"></formly-validation-message>
  </div>

  <span *ngIf="props.description"
        class="cds--form__helper-text">{{ props.description }}</span>
</div>
